<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001a14" />
  <title>SABR — Splash Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #001a14; }
    body { min-height: 100svh; overflow: hidden; }
    .screen { position: fixed; inset: 0; display: grid; place-items: center; }
    #splash {
      z-index: 2;
      background: #001a14;
      opacity: 1;
      visibility: visible;
      transition: opacity 180ms ease, visibility 180ms ease;
    }
    #splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    /* Show the whole splash picture on wider laptop monitors. */
    @media (min-aspect-ratio: 3/2) {
      #splash img { object-fit: contain; }
    }
    #home {
      background: radial-gradient(ellipse at 50% 30%, #083b2b 0%, #041a15 55%, #010906 100%);
      color: #f4f4e9;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .contents { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .wordmark { font: 400 clamp(2.5rem, 9vw, 4.5rem)/1.1 Georgia, serif; letter-spacing: .28em; margin-left: .28em; }
    .arabic { font-size: clamp(2.5rem, 8vw, 4rem); color: #72d8a5; }
    .message { font-size: 15px; max-width: 27ch; color: #b5cbbd; line-height: 1.6; }
    button {
      margin-top: 12px; min-height: 48px; padding: 13px 26px;
      background: #55d49c; color: #07271b;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <main id="home" class="screen" aria-label="Preview after loading screen">
    <div class="contents">
      <div class="wordmark">SABR</div>
      <div class="arabic" lang="ar" dir="rtl">صبر</div>
      <p class="message">Splash screen complete. This is just a test page, not the SABR app.</p>
      <button id="replay" type="button">Replay 1-second splash</button>
    </div>
  </main>

  <div id="splash" class="screen" role="img" aria-label="SABR loading screen featuring the green logo, Arabic and English name and progress bar">
    <img src="assets/sabr-splash.png" alt="" fetchpriority="high" />
  </div>

  <script>
    const splash = document.getElementById('splash');
    const replay = document.getElementById('replay');
    const SPLASH_DURATION_MS = 1000;
    const FADE_DURATION_MS = 180;
    let timeout;

    function showSplash() {
      window.clearTimeout(timeout);
      splash.classList.remove('is-hidden');
      replay.disabled = true;
      timeout = window.setTimeout(() => {
        splash.classList.add('is-hidden');
        replay.disabled = false;
      }, SPLASH_DURATION_MS - FADE_DURATION_MS);
    }

    // Start the one-second preview after the image is fully loaded.
    window.addEventListener('load', showSplash, { once: true });
    replay.addEventListener('click', showSplash);
  </script>
</body>
</html>
