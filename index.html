<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111312" />
  <meta name="color-scheme" content="dark" />
  <title>SABR — Minimal Splash Test</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #111312; }
    body { min-height: 100svh; }
    .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

    /* No image background, effects, progress bar, or third-party fonts. */
    #splash {
      z-index: 10;
      background: #111312;
      opacity: 1;
      visibility: visible;
      transition: opacity 160ms ease-out, visibility 160ms ease-out;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 28px;
      transform: translateY(-3vh);
    }
    .app-icon {
      width: clamp(132px, 36vw, 166px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 31%;
      background: #1b1e1c;
    }
    .emblem { display: block; height: 74%; width: 55%; }
    .arabic-name {
      margin: 29px 0 0;
      color: #f2f1e9;
      font-family: "Noto Naskh Arabic", "Noto Sans Arabic", "Geeza Pro", "Traditional Arabic", Tahoma, serif;
      font-size: clamp(40px, 10vw, 52px);
      font-weight: 400;
      line-height: 1.5;
      direction: rtl;
    }
    .english-name {
      margin: 2px 0 0;
      padding-left: .27em;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #d6d9d5;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .27em;
      line-height: 1.5;
    }

    #home {
      background: #111312;
      color: #f2f1e9;
      text-align: center;
      padding: 26px;
    }
    .home-content { max-width: 340px; }
    .home-content h1 { font-weight: 600; font-size: 24px; letter-spacing: .14em; margin-bottom: 12px; }
    .home-content p { color: #b0b9b3; font-size: 15px; line-height: 1.6; }
    button {
      appearance: none;
      margin-top: 20px;
      padding: 13px 20px;
      min-height: 48px;
      background: #2dad7a;
      border: none;
      border-radius: 10px;
      color: #08140e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #f2f1e9; outline-offset: 4px; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Temporary preview destination. Replace with actual SABR home screen later. -->
  <main id="home" class="screen">
    <div class="home-content">
      <h1>SABR</h1>
      <p>The minimal splash screen has finished. This is a test page, not your actual app.</p>
      <button id="replay" type="button">Replay 1-second splash</button>
    </div>
  </main>

  <section id="splash" class="screen" aria-label="SABR opening screen">
    <div class="splash-lockup">
      <div class="app-icon" aria-label="SABR emerald diamond symbol" role="img">
        <!-- Lightweight vector reinterpretation of the selected emerald diamond logo. -->
        <svg class="emblem" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M50 2 82 80 50 158 18 80Z" fill="#23ac78"/>
          <path d="M50 2 50 80 18 80Z" fill="#49c792"/>
          <path d="M50 2 82 80 50 80Z" fill="#2cb886"/>
          <path d="M18 80 50 158 50 80Z" fill="#17855e"/>
          <path d="M50 80 50 158 82 80Z" fill="#219e70"/>
          <path d="M50 56 69 80 50 104 31 80Z" fill="#1b1e1c"/>
        </svg>
      </div>
      <div class="arabic-name" lang="ar" dir="rtl">صبر</div>
      <div class="english-name">SABR</div>
    </div>
  </section>

  <script>
    const splash = document.getElementById('splash');
    const replay = document.getElementById('replay');
    const DURATION = 1000;
    const FADE = 160;
    let hideTimer;

    function playSplash() {
      clearTimeout(hideTimer);
      splash.classList.remove('hidden');
      replay.disabled = true;
      // Total splash time ~1000ms, including the final 160ms fade.
      hideTimer = setTimeout(() => {
        splash.classList.add('hidden');
        setTimeout(() => { replay.disabled = false; }, FADE);
      }, DURATION - FADE);
    }

    // Splash is visible immediately from HTML/CSS. Start the 1-second timer on DOM readiness.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', playSplash, { once: true });
    } else {
      playSplash();
    }
    replay.addEventListener('click', playSplash);
  </script>
</body>
</html>
